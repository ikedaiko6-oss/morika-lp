<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>お問い合わせを受け付けました｜杜花</title>
  <style>
    :root { --ink: #1a1410; --paper: #f5f0e8; --forest: #3a5240; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 560px; }
    h1 { color: var(--forest); font-family: serif; font-weight: 600; }
    p { line-height: 1.9; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.4rem; background: var(--forest); color: var(--paper); text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p>杜花｜お問い合わせ</p>
    <h1>お問い合わせを受け付けました</h1>
    <p>内容を確認のうえ、メールでお返事します。お問い合わせありがとうございました。</p>
    <a href="/">公式サイトへ戻る</a>
  </main>
</body>
</html>
